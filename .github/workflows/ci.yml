name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --group test --python ${{ matrix.python-version }}
      # The detector-weight download is mocked in the tests (see tests/test_cli_run.py),
      # so the suite runs fully offline -- no network or weight cache needed.
      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest --cov=deeperfly --cov-report=term-missing

  test-ik:
    # The inverse-kinematics solver (QuickIK) is an optional extra: it publishes no
    # wheels, so installing it compiles a Rust extension. The matrix above therefore
    # runs *without* it -- which is the right default, but it means every test that
    # solves is skipped there. This job is where the solver is actually exercised.
    # One Python version only: PyO3 builds per interpreter, so each would recompile.
    name: test (ik extra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync dependencies (with the ik extra)
        run: uv sync --group test --extra ik --python 3.12
      - name: The extra really is importable
        # Guard the point of this job: the solver tests all `importorskip`, so a failed
        # build would leave the suite green with every one of them skipped.
        run: uv run --python 3.12 python -c "import quickik"
      - name: Run tests
        run: uv run --python 3.12 pytest

  test-gui-browser:
    # The editor's JavaScript has exactly one gate, and this is where it runs. `playwright`
    # is in the `test` group, but the chromium build it drives is a separate download, so
    # the jobs above skip the file -- here it is installed and the file runs alone.
    #
    # Alone, and not folded into the matrix, because it is browser WAIT rather than work:
    # 168 s serially against 34 s of CPU, which would double the matrix's wall time three
    # times over for no extra coverage.
    name: test (gui browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --group test --python 3.13
      - name: Install chromium
        run: uv run --python 3.13 playwright install --with-deps chromium
      - name: Run the browser tests
        # The suite runs them too, but only after importing torch/jax in 32 workers to
        # collect the rest; this job wants the browser file and nothing else.
        #
        # The `grep` is the point of the job: a missing browser makes every test in the
        # file SKIP, which would otherwise report this green with nothing exercised.
        run: |
          set -o pipefail
          uv run --python 3.13 pytest tests/test_gui_browser.py -q | tee browser.log
          grep -qE '^53 passed' browser.log

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      # Pinned to match .pre-commit-config.yaml.
      - name: Ruff lint
        run: uvx ruff@0.15.14 check
      - name: Ruff format
        run: uvx ruff@0.15.14 format --check
      - name: uv.lock in sync with pyproject.toml
        run: uv lock --check

  typecheck:
    name: typecheck (advisory)
    runs-on: ubuntu-latest
    # Non-blocking: pyright runs in "basic" mode (see [tool.pyright] in pyproject)
    # to surface real issues without gating on JAX/torch/jaxtyping dynamism.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --group test
      - name: Pyright
        run: uv run --with pyright pyright

  docs:
    name: docs (strict build)
    runs-on: ubuntu-latest
    # A PR gate, which the deploy workflow cannot be. `docs.yml` runs only on pushes to
    # main, so until now a docs break landed on main and failed the DEPLOY -- after review,
    # with the site left at its previous build and nothing in the PR having said so.
    #
    # `--strict` earns the gate: mkdocstrings resolves every `:::` identifier at build time,
    # so deleting or renaming a documented symbol fails here rather than silently publishing
    # a page with a hole in it, and a dangling internal anchor fails the same way.
    #
    # What it does NOT catch: a broken mermaid fence. Material fetches mermaid from a CDN at
    # page-view time, so a malformed diagram renders as nothing and builds clean. Check a
    # touched diagram by eye.
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Build the site strictly
        run: uv run --group docs mkdocs build --strict
