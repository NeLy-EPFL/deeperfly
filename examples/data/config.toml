# deeperfly run configuration -- the bundled seven-camera demo clip.
#
#     deeperfly run <this directory>     # -o defaults to its own deeperfly_outputs/
#
# Everything one run needs: footage, rig, skeleton, detector, stages. Only what this
# recording has a reason to say is written -- an omitted stage table runs on its own
# defaults, which `deeperfly config show <section>` prints. Full reference:
# docs/reference/configuration.md.
#
# This is the packaged default config with one change: the demo's footage is named
# by DeepFly3D positional index, so the sources say so outright. Running the
# recording with no -c picks up the packaged config and works the same way.


# == Views ===================================================================
# The geometric cameras a pathway maps its points back into. A view holds only geometry;
# its footage comes from the pathway's source, and its intrinsics describe that source's
# RAW frame -- the crops below never move the principal point, because detections are
# mapped back to raw pixels before they meet a camera. `defaults` merges into each view.
#
# A solved rig wins over the orbits below, which are then read only for the camera ORDER:
#
#   [calibration]
#   path = "calibration.toml"             # relative to THIS file
[default_camera]
focal_length_px = 22388.125               # scalar when fx == fy, else [fx, fy]
distance = 107.463
# principal_point_px = [479.5, 239.5]     # omit: inferred per view from its own frame

[cameras.rh]
video = 'camera_0.mp4'
azimuth_deg = -120
[cameras.rm]
video = 'camera_1.mp4'
azimuth_deg = -90
[cameras.rf]
video = 'camera_2.mp4'
azimuth_deg = -45
[cameras.f]
video = 'camera_3.mp4'
azimuth_deg = 0
[cameras.lf]
video = 'camera_4.mp4'
azimuth_deg = 45
[cameras.lm]
video = 'camera_5.mp4'
azimuth_deg = 90
[cameras.lh]
video = 'camera_6.mp4'
azimuth_deg = 120


# == Pipeline ================================================================
# The stages, in run order. `pose2d = false` reconstructs from the cached 2D without
# re-detecting; an enabled stage reuses its cache while its keys here are unchanged, so
# an edit recomputes exactly the affected stages. `--overwrite [stage]` forces it.
[pipeline]
pose2d                  = true
bundle_adjustment       = true
pictorial_structures    = false  # DeepFly3D-style peak recovery over the top-K candidates
triangulation           = true
eks                     = true   # ensemble Kalman smoother over the 3D (de-jitters, repairs)
postprocess             = true   # the corrections below, from knowing the animal
inverse_kinematics      = false  # fit NeuroMechFly joint angles (needs `deeperfly[ik]`)
visualization           = true


# == 2D detection ============================================================
# A DENSE plan (7 pathways, one per camera), generated by `deeperfly
# dense-config`. The model emits every tracked point for every view, so the
# mapping is channel i -> point i of the pathway's view and no
# [pose2d.output_points] table is written: the 38 x 7 rows it would take carry no
# information, and a transposition in any one is a wrong limb rather than a crash.
# That the model's channels really are this skeleton's, in this order, is checked
# when the weights load.
#
# `model` is the default for every pathway below; write `model` on one to override
# it. Everything else about the model -- input_size, mean, n_out_channels, and the
# multiview transformer's float32 -- is a property of the checkpoint whose loader
# refuses a config that disagrees, so the class states it and this does not.
[pose2d]
class = "mvt"
weights = "mvt_r28_pad48_gray_fly38.pth"


# == Bundle adjustment =======================================================
# The fly itself is the target; scipy.optimize.least_squares kwargs (max_nfev, loss,
# f_scale, ...) sit directly in this table.
[bundle_adjustment]
# The leg joints sit at sharp limb corners and detect most reliably, so only they drive
# the solve. Omit this key to use every keypoint.
points = ["lf_*", "lm_*", "lh_*", "rf_*", "rm_*", "rh_*"]
fixed = ["*.intr"]          # e.g. also "f.rvec"/"f.tvec" to fix the world gauge
weigh_by_confidence = false
max_frames = 200            # bundle-adjust on at most this many frames
max_nfev = 2000             # forwarded to scipy.optimize.least_squares
loss = "linear"


# == Ensemble Kalman smoother ================================================
# One 3D trajectory per keypoint fitted to the whole recording against every view, with
# the rig's own projection as the observation model.
[eks]
# Raised from the shipped 5.0, which over-flags: measured against hand labels on 54
# recordings (63,921 labeled cells), 30 beats both 5 and 15 on 2D accuracy and leaves
# fewer blown cells, while keeping the frame-to-frame jumps 5 and 15 are better at than
# 60+. A blown detection sits at Mahalanobis ~1e4, so every threshold in this range still
# catches it; raising it only stops down-weighting cells the detector had right.
inflate_threshold = 30.0


# == Postprocess =============================================================
# Corrections from knowing the ANIMAL rather than the pixels, applied in order to the
# finished 3D. Runs after the smoother because the smoother re-derives 3D from the 2D, so
# anything corrected before it is followed straight back off. ORDER MATTERS: with one
# fitted plane symmetrize is a FIXED map, so static-then-symmetrize satisfies both
# exactly and the other order would not.

# This fly is TETHERED, so its thorax plate does not move: these seven are a constant of
# the recording and everything the estimate does over time is per-frame noise. `abdomen*`
# is deliberately absent -- it pitches, telescopes and bends, which is worth measuring.
[[postprocess.ops]]
op = "static"
method = "median"           # or mean / trimmed_mean / mode / geometric_median
points = ["neck",
          "lf_thorax_coxa", "lm_thorax_coxa", "lh_thorax_coxa",
          "rf_thorax_coxa", "rm_thorax_coxa", "rh_thorax_coxa"]

# Each side is triangulated from its own cameras, so a left/right pair drifts apart by
# whatever the two sides' errors differ by; this closes that gap. ONLY body-fixed pairs --
# never the legs, whose left/right asymmetry at any instant IS the behavior.
[[postprocess.ops]]
op = "symmetrize"
points = ["l*_thorax_coxa"]      # either half of each pair
midline = ["neck"]


# == Visualization ===========================================================
# A video is a `grid` of camera cells with `layers` over them; layers draw IN ORDER.
# `stage` names which stage's points a layer draws -- left out it means "the
# most-derived stage present", so naming it is how each video keeps meaning one thing.

[visualization.default_video]
background = "black"
crop = "pose2d"
cell = [480, 240]           # grid cell size, in pixels

# What every layer is unless it says otherwise.
[visualization.default_layer]
line_thickness = 2

# Right-side cameras in the LEFT column, so the montage reads as the animal from above.

[visualization.videos.pose2d]
grid = [["rf", "f", "lf"], ["rm", "", "lm"], ["rh", "", "lh"]]
layers = [{ draw = "skeleton_2d", stage = "pose2d" }]

[visualization.videos.pose3d]
grid = [["rf", "f", "lf"], ["rm", "bird", "lm"], ["rh", "", "lh"]]
layers = [{ draw = "skeleton_3d", stage = "triangulation" }]

[visualization.videos.pose_nmf]
grid = [["rf", "f", "lf"], ["rm", "", "lm"], ["rh", "", "lh"]]
layers = [{ draw = "skeleton_nmf" }]

[visualization.videos.pose_mesh]
grid = [["rf", "f", "lf"], ["rm", "", "lm"], ["rh", "", "lh"]]
layers = [{ draw = "mesh_nmf", alpha = 0.55 }]
