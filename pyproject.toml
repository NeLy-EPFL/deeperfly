[project]
name = "deeperfly"
version = "0.1.0"
description = "Markerless 3D pose estimation of tethered Drosophila from a multi-camera rig, in JAX"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "tkclam", email = "thomas.lam@epfl.ch" },
]
keywords = [
    "pose-estimation",
    "drosophila",
    "neuroscience",
    "bundle-adjustment",
    "triangulation",
    "multi-view-geometry",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = [
    # Geometry/BA core (float64, JIT- and grad-friendly), kept on the CPU -- the
    # arrays are tiny, so a GPU never helps. CPU JAX is portable on every platform
    # and is the only JAX deeperfly installs (the detector is PyTorch).
    "jax>=0.10.1",
    # The 2D detector (PyTorch). torch loads the original DeepFly2D weights
    # directly, uses CUDA on NVIDIA GPUs (its PyPI wheel already bundles CUDA), and
    # auto-uses Metal (MPS) on Apple Silicon -- so no extra is needed for either.
    "torch>=2.2",
    "torchvision>=0.17",
    # Backbones for the dense-38 detector (deeperfly.pose2d.hrnet): a 38-channel HRNet
    # that predicts every tracked point in every view, so a camera needs one pathway
    # instead of a pathway and a mirrored twin. Tiny next to torch, and imported lazily
    # -- a run that only uses the shipped hourglass never touches it.
    "timm>=1.0",
    "jaxtyping>=0.3.10",
    "numpy>=2.4.6",
    "scipy>=1.14",
    "h5py>=3.11",
    "platformdirs>=4.0",
    "rich>=14.0",
    "typer>=0.26",
    "av>=13",
    "opencv-python-headless>=4.13",
    "natsort>=8.4.0",
    # The interactive web viewer/corrector (`deeperfly gui`): FastAPI + uvicorn
    # serve a browser front-end (the compiled assets ship in the wheel under
    # deeperfly/gui/web). Kept in the core deps -- they're tiny next to torch/jax
    # and `deeperfly gui` is a first-class subcommand, so a plain install must be
    # able to run it. The `[standard]` uvicorn extra pulls the WebSocket +
    # http-tools speedups; both are still imported lazily (only `gui` needs them).
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # GPU rasterizer for the NeuroMechFly mesh overlay (videos + GUI). moderngl is a
    # tiny pure-Python wrapper over OpenGL; importing it never needs a GPU (a context
    # is only created lazily at render time, via headless EGL), and the overlay
    # transparently falls back to the CPU rasterizer when no GL context is available
    # -- so this is safe on headless boxes without a GL driver.
    "moderngl>=5.10",
]

[project.optional-dependencies]
# The `inverse_kinematics` stage's solver: QuickIK, a Rust whole-body IK library with
# PyO3 bindings (https://nely-epfl.github.io/quickik/). Optional because it publishes
# no wheels -- installing it builds the Rust extension with maturin, so it needs a Rust
# toolchain, which nothing else in deeperfly does. The stage is opt-in and off by
# default, and a result file that already holds a fit renders its overlays (videos and
# GUI alike) without this extra, so a plain install stays Rust-free.
#
# The git source lives in [tool.uv.sources] rather than as a PEP 508 direct reference
# here: a direct URL would be baked into the published metadata, and PyPI rejects
# distributions carrying one. Users installing from PyPI need the explicit
#   pip install "quickik @ git+https://github.com/NeLy-EPFL/quickik#subdirectory=python"
ik = ["quickik"]

[tool.uv.sources]
quickik = { git = "https://github.com/NeLy-EPFL/quickik", subdirectory = "python", rev = "f5b88ddd9fd24d5e56697ac918972c84a47e1312" }

[project.urls]
Homepage = "https://github.com/NeLy-EPFL/deeperfly"
Documentation = "https://nely-epfl.github.io/deeperfly/"
Repository = "https://github.com/NeLy-EPFL/deeperfly"
Issues = "https://github.com/NeLy-EPFL/deeperfly/issues"

[project.scripts]
deeperfly = "deeperfly.cli:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    # Notebook plotting only (examples/*.ipynb; not used by the package). Plotly
    # draws the interactive figures, which stay interactive when the notebooks are
    # rendered into the docs; matplotlib still draws a few static panels in
    # pipeline_walkthrough.ipynb.
    "matplotlib>=3.10",
    "plotly>=6.8.0",
]
test = [
    "pytest>=9.0.3",
    "pytest-cov>=6.0",
    # Runs the suite across processes (`-n auto` in addopts). The suite is ~110s of
    # genuine per-test work with no single hot spot, so parallelism is the only large
    # lever: 115s serial -> 39s on 24 cores. Pairs with the `threadcap` plugin, which
    # is what makes it pay off (see tests/threadcap.py).
    "pytest-xdist>=3.6",
    # Exercise the web GUI: FastAPI's TestClient (httpx-backed) drives the API +
    # WebSocket in-process, no real server or browser needed. FastAPI/uvicorn
    # themselves are core deps; only the httpx test client is test-only.
    "httpx>=0.27",
]
docs = [
    # The documentation site (MkDocs + Material). The library API reference is
    # generated from the source docstrings by mkdocstrings (griffe reads the
    # source statically, so the heavy runtime deps are not imported to build it).
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "ruff>=0.6",   # mkdocstrings uses it to format the rendered API signatures
    # Renders the example notebooks (examples/*.ipynb) into the site from their
    # stored outputs (execute: false), so the Plotly figures stay interactive
    # without importing torch/jax at build time.
    "mkdocs-jupyter>=0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
# `-p threadcap` must come before anything imports numpy/jax/torch; `-n auto` uses
# one worker per physical core. Override either per-run: `-n 0` restores a plain
# in-process run (what you want for `--pdb`, `-s`, or a single test).
addopts = "-q -p threadcap -n auto"

[tool.ruff.lint]
# Default rules (E4/E7/E9 + F) plus pycodestyle warnings (W) and import sorting (I).
# F722/F821 are off because jaxtyping uses string shape annotations (e.g.
# Float[Array, "n 3"]) that pyflakes misreads as forward references. The pyupgrade
# (UP) rules are deliberately *not* enabled for the same reason: UP037 would strip
# the quotes from those shape strings and break the annotations.
select = ["E4", "E7", "E9", "F", "W", "I"]
ignore = ["F722", "F821"]

[tool.coverage.run]
source = ["deeperfly"]
branch = true

[tool.pyright]
include = ["src/deeperfly"]
# Heavy dynamic JAX/PyTorch plus jaxtyping string annotations make strict checking
# noisy; "basic" surfaces real issues without the flood. Runs as an advisory
# (non-blocking) CI job, not in pre-commit.
typeCheckingMode = "basic"
pythonVersion = "3.11"
