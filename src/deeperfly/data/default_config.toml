# deeperfly run configuration -- everything one run needs, in one file.
#
#     deeperfly run recording/ -c config.toml -o outputs/
#     # -c defaults to this packaged config; -o to <recording>/deeperfly_outputs/
#
# This file carries the STRUCTURE of a run -- footage, rig, skeleton, detector -- and the
# few values this setup has a measured opinion about. It does not restate defaults: an
# omitted stage table runs on its own, and every key is one command away.
#
#     deeperfly config show eks                      # one section, with its docs
#     deeperfly config set eks.inflate_threshold 30  # validated as a run would
#
# Sections are independently usable (CameraGroup.from_config reads only [cameras.*]), and
# an enabled stage reuses its cache while its keys here are unchanged -- so an edit
# recomputes exactly the affected stages. `--overwrite [stage]` forces it.
# Full reference: docs/reference/configuration.md.


# == Skeleton ================================================================
# Normally absent, as it is here: the skeleton is points, edges, symmetries and colors in
# a version-controlled file of its own (src/deeperfly/data/skeletons/fly38.toml), and a
# run resolves the packaged one. `[skeleton] include = "<name or path>"` overrides that,
# and any key written alongside replaces that skeleton's.
#
# It must be the skeleton the detector was TRAINED on: a dense detector's channels ARE a
# skeleton, so the wrong one attaches points to the wrong joints. That is checked against
# the checkpoint every run, by the ordered point NAMES and not by any label -- which is
# what makes it a real check: this file was called `fly38b` before 0.2 (that spelling
# still resolves), and the DeepFly3D set that `fly38` named until then was also 38
# points, sharing 32 of these in a different order. A count could not tell them apart.
#
# [skeleton]
# include = "fly38"


# == Rig =====================================================================
# A solved calibration WINS over [default_camera] + [cameras.*], which are then read only
# for the camera ORDER (the V axis of every points array). That is how a rig travels
# between recordings: an orbit is a human's description of it, a calibration a solver's
# measurement, and raw extrinsics cannot be written in a camera table at all. Point it at
# a calibration.toml from a previous run (`deeperfly calibration export`) or a board.
#
# [calibration]
# path = "calibration.toml"                # relative to THIS file

# What every camera is before it says otherwise: each [cameras.<name>] starts here and
# overrides what it needs. Same keys as a camera.
[default_camera]
focal_length_px = 22388.125               # scalar when fx == fy, else [fx, fy]
distance = 107.463
# principal_point_px = [479.5, 239.5]     # omit: each camera's own frame center


# == Cameras =================================================================
# One table per camera, in the order that is the V axis of every points array. Intrinsics
# describe the RAW frame, so a detection window ([pose2d.crops]) never moves the principal
# point -- detections map back to raw pixels before they meet a camera. [cameras] holds
# nothing but cameras: shared values live in [default_camera] and the solved rig in
# [calibration].
#
# `video` is a case-insensitive `re.fullmatch` over the filenames directly inside the
# recording directory, or a list of them, and everything it matches is ONE stream
# (matches of each entry in natural order, entries in written order, concatenated). A
# split recording and an image sequence are the same rule. Alternate names go inside
# the regex -- `camera_(RH|0)` takes anatomical or DeepFly3D positional naming. Nothing
# is inferred from the camera name or its index.
#
# The matches of one entry must be PARTS OF ONE SERIES: identical once runs of digits
# are masked. `camera_RH_0.mp4` + `camera_RH_1.mp4` concatenate; `camera_RH.mp4` +
# `camera_0.mp4`, or `.mp4` + `.avi`, are an error naming them rather than a guess.
#
# The default stays tight -- containers only -- because a looser pattern also picks up
# sidecars and stray takes. The two shapes it does not match:
#
#     video = 'camera_(RH|0)_\d+\.(mp4|avi|mov|mkv|webm|m4v)'    # a split recording
#     video = 'camera_(RH|0)_\d+\.(png|jpe?g|tiff?|bmp|webp)'    # an image sequence
#
# Write patterns as TOML LITERAL strings (single quotes) -- `\d` in a basic string is
# an invalid escape and the config will not parse.
[cameras.rh]
video = 'camera_(RH|0)\.(mp4|avi|mov|mkv|webm|m4v)'
azimuth_deg = -120
[cameras.rm]
video = 'camera_(RM|1)\.(mp4|avi|mov|mkv|webm|m4v)'
azimuth_deg = -90
[cameras.rf]
video = 'camera_(RF|2)\.(mp4|avi|mov|mkv|webm|m4v)'
azimuth_deg = -45
[cameras.f]
video = 'camera_(F|3)\.(mp4|avi|mov|mkv|webm|m4v)'
azimuth_deg = 0
[cameras.lf]
video = 'camera_(LF|4)\.(mp4|avi|mov|mkv|webm|m4v)'
azimuth_deg = 45
[cameras.lm]
video = 'camera_(LM|5)\.(mp4|avi|mov|mkv|webm|m4v)'
azimuth_deg = 90
[cameras.lh]
video = 'camera_(LH|6)\.(mp4|avi|mov|mkv|webm|m4v)'
azimuth_deg = 120

# The axial hind view: the rig's only left/right BRIDGE, and the reason the shipped
# detector was trained on eight. Without it no camera sees both body sides, so a
# contralateral joint is triangulated from one side's cameras alone.
#
# Its numbers are not the side cameras': this view is on a different lens, which changes
# BOTH focal length and distance, and no residual can afterwards detect that -- bundle
# adjustment holds the intrinsics fixed, so it absorbs a focal error into the distance and
# reports a clean solve. Measure them per rig (the foam ball is a ruler for exactly this);
# these are the 8-view example rig's.
#
# A recording WITHOUT this camera needs no edit here: the run narrows itself to the footage
# it finds, drops this view, and says so. Below two views it refuses instead.
[cameras.h]
video = 'camera_(H|7)\.(mp4|avi|mov|mkv|webm|m4v)'
azimuth_deg = 180
focal_length_px = 24168.591
distance = 158.9168


# == Pipeline ================================================================
# The stages, in run order. `pose2d = false` reconstructs from a cached 2D pose without
# re-detecting; the 2D cache always feeds downstream, while a derived stage's cached output
# is used only while that stage is on. An enabled stage whose input is unavailable is
# skipped, with the reason logged.
[pipeline]
pose2d               = true
bundle_adjustment    = true
pictorial_structures = false  # DeepFly3D-style peak recovery over the top-K candidates
triangulation        = true
# MEASURED: -39% 3D jitter, at the cost of lagging a claw mid-swing (0.13% of cells).
# Turn off if claw timing is the measurement -- configuration.md#eks has the numbers.
eks                  = true   # ensemble Kalman smoother over the 3D (de-jitters, repairs)
# Assumes a TETHERED animal (see the chain below). Turn off for a freely-moving one.
postprocess          = true   # the corrections below, from knowing the animal
# Needs `deeperfly[ik]`; without it the stage SKIPS with the reason logged rather than
# failing the run, so a plain install still gets everything else.
inverse_kinematics   = true   # fit NeuroMechFly joint angles
visualization        = true


# == 2D detection ============================================================
# One detector, run once per camera, emitting every skeleton point: channel i is
# [skeleton] points[i]. So a camera IS a source IS a pathway IS a view, and only the
# camera is named -- the plan is synthesized from the table above. (The historical
# 19-channel detector predicted one body side, ran each side camera twice through a flip,
# and needed 132 hand-written mapping rows. A contralateral point now arrives as a
# prediction to correct, not a gap to author from nothing.)
#
# `class` picks the network, and there are two. "mvt" encodes a frame's views TOGETHER, so
# a joint only one camera can see informs the ones that cannot -- which is why it is the
# default. "hrnet" predicts each view alone, and runs both single-view checkpoints
# (hrnet_w32 and hgnetv2_b4), selecting its feature maps by STRIDE rather than by index.
# Both take ONE grayscale plane and emit one channel per tracked point.
#
# `weights` is a bare filename found on $DEEPERFLY_MODELS, or an outright path; a dense
# detector is trained per project, so there is nothing to download and the run stops with
# the search path printed if it finds none. Prefer the bare name: it is a fact about
# which model a run used and travels with the recording, where /mnt/... is a fact about
# one machine. input_size, mean, the channel count and mvt's float32 are properties of
# the checkpoint, whose loader refuses a config that disagrees.
#
# No `batch_size`: 16, the default, is also the measured best (configuration.md#pose2d).
[pose2d]
class = "mvt"
weights = "mvt_r28_pad48_gray_fly38.pth"
auto_crops = ["f", "h"]

# `auto_crops` names cameras whose window is SEARCHED per recording; [pose2d.crops]
# gives fixed windows as `[x, y, width, height]` in raw pixels. In neither: full frame.
# In both: the search starts from the box written here.
#
# A detector is trained through a box, and a differently framed camera puts the animal at
# the wrong apparent SCALE -- the one thing no augmentation undoes. On this rig the six
# side cameras match training full-frame and the two AXIAL ones (front and hind, 1600x1008
# against the side cameras' 960x512) do not: dropped in whole, the fly lands too small and
# detection collapses (255 px). So those two get a box, and it is MEASURED per recording
# rather than copied -- searching reaches 2.9 px blind, against 3.4 px hand-tuned.
#
# It improves once the rig is solved, and is worth having before that. The search is a grid
# over (centre, width) scored by detector CONFIDENCE, which needs nothing; what needs a rig
# is the accept GATE, which is reprojection agreement with the other cameras' 3D -- because
# confidence decouples from accuracy once the centre is free (a recording that went
# 0.338 -> 0.403 confidence went 30.9 -> 37.5 px WORSE, and the two signals are uncorrelated
# on this rig's hind view at r = +0.17). The gate self-checks: against a nominal orbit it
# measures its own reference ~250 px out, refuses rather than choose with a broken ruler, and
# falls back to confidence alone -- a box ~1.7x too wide, which is still far better than the
# whole frame. Run once, `deeperfly calibration export`, point [calibration].path at it,
# and the gate engages.
#
# The searched box lands in <outdir>/autocrop.json and is reused, so a resume neither
# re-searches nor re-detects; `deeperfly auto-crop` runs it alone and prints the TOML that
# freezes it. [pose2d.crop_search] holds the search's own knobs.
[pose2d.crops]
# rh = [737, 0, 960, 512]   # this rig's side cameras match training full-frame


# == Bundle adjustment =======================================================
# The fly itself is the target; scipy.optimize.least_squares kwargs (max_nfev, loss,
# f_scale, ...) sit directly in this table. `deeperfly config show bundle_adjustment`
[bundle_adjustment]
# The leg joints sit at sharp limb corners and detect most reliably, so only they drive
# the solve. Omit this key to use every keypoint.
points_to_use = [
    "lf_thorax_coxa", "lf_coxa_trochanter", "lf_femur_tibia", "lf_tibia_tarsus", "lf_claw",
    "lm_thorax_coxa", "lm_coxa_trochanter", "lm_femur_tibia", "lm_tibia_tarsus", "lm_claw",
    "lh_thorax_coxa", "lh_coxa_trochanter", "lh_femur_tibia", "lh_tibia_tarsus", "lh_claw",
    "rf_thorax_coxa", "rf_coxa_trochanter", "rf_femur_tibia", "rf_tibia_tarsus", "rf_claw",
    "rm_thorax_coxa", "rm_coxa_trochanter", "rm_femur_tibia", "rm_tibia_tarsus", "rm_claw",
    "rh_thorax_coxa", "rh_coxa_trochanter", "rh_femur_tibia", "rh_tibia_tarsus", "rh_claw",
]
fixed = ["*.intr"]          # e.g. also "f.rvec"/"f.tvec" to fix the world gauge
weigh_by_confidence = false
max_frames = 200            # bundle-adjust on at most this many frames


# == Ensemble Kalman smoother ================================================
# One 3D trajectory per keypoint fitted to the whole recording against every view, with
# the rig's own projection as the observation model. `deeperfly config show eks`
[eks]
# Raised from the shipped 5.0, which over-flags: measured against hand labels on 54
# recordings (63,921 labeled cells), 30 beats both 5 and 15 on 2D accuracy and leaves
# fewer blown cells, while keeping the frame-to-frame jumps 5 and 15 are better at than
# 60+. A blown detection sits at Mahalanobis ~1e4, so every threshold in this range still
# catches it; raising it only stops down-weighting cells the detector had right.
inflate_threshold = 30.0


# == Inverse kinematics ======================================================
# Every knob is at its default, so no table is written (`deeperfly config show
# inverse_kinematics`). Three things about the packaged model are worth knowing:
#
# The leg segment lengths are MEASURED per leg, which fits this fly rather than a generic
# one but measures each side on its own. `symmetric_segments` (ON by default) gives each
# mirror pair the mean of the two -- one animal rather than two half-animals. It constrains
# the ANIMAL only: the two sides' joint angles stay independent, because a leg's left/right
# asymmetry at any instant is the behavior.
#
# It costs a little, and measurably: all five points of a leg are tracked, so the chain is
# over-determined and the per-leg lengths already ARE the best fit to the data. On the
# 8-view example recording the femurs measure 4-6% apart on all three pairs (always
# left-longer, a stable offset), and sharing them made every score worse -- 3D residual
# +22%, 2D reprojection +0.14 px in 7 of 8 views, and the left/right gap in each DOF's
# median angle 4.7 -> 6.4 deg, which is the opposite of what sharing was supposed to fix.
# It is the default anyway because the fit is a statement about an animal: set it false to
# fit whatever the keypoints say, two half-animals included. The numbers are in
# docs/reference/configuration.md#ik-symmetric-segments.
#
# Both chains are targeted at THIS skeleton, so a body plan covers all 38 points. The
# abdomen's five markers are the dorsal-midline tergite stripes, placed on the model at
# the same body + offset the docs keypoint viewer draws them at -- so what the labeling
# reference shows and what the IK fits are the same choice, read from the same file. The
# other side of that: a skeleton whose points the baked chains have no marker for gets NO
# fit for that chain, and no chain SIZE either when its marker set contains no separation
# the size estimate can use. Both are warned about rather than silent -- which is what the
# retired DeepFly3D point set, with its two abdomen side chains and no neck, would hit.
#
# Retarget a chain with a marker table if your labeling scheme differs (`body` names a
# baked body; the abdomen chain is c_abdomen12 / c_abdomen3 / c_abdomen4 / c_abdomen5 /
# c_abdomen6). Declaring the table REPLACES that chain's markers, so list all of them:
#
#   [inverse_kinematics.abdomen]
#   abdomen0 = { body = "c_abdomen3", offset = [0.0, 0.0, 0.30] }
#   abdomen1 = { body = "c_abdomen4", offset = [0.0, 0.0, 0.285] }
#   abdomen2 = { body = "c_abdomen5", offset = [0.0, 0.0, 0.27] }
#   abdomen3 = { body = "c_abdomen6", offset = [0.0, 0.0, 0.243] }
#   abdomen4 = { body = "c_abdomen6", offset = [-0.23, 0.0, 0.20] }
#
# Each chain also gets ONE uniform size multiplier of its own, measured from the marker
# separations its own joints cannot change -- the head's neck-to-antennae radius, the
# abdomen's one pair sharing a body. That restriction is what keeps posture out of size:
# the abdomen's markers sit on the dorsal surface, the OUTSIDE of a ventral bend, so a
# ruler drawn along the chain reads a curled abdomen as 57% larger across the joints'
# range. A left-to-right distance is excluded for a second reason -- across the corpus
# the l_antenna-r_antenna span reads 1.515x the model where either antenna's distance to
# the neck reads 1.196x, 26% wider in all 30 recordings, because each side is
# triangulated from its own cameras -- so a mirror pair is folded to its midpoint first.
#
# `neck` is not an ordinary marker: it is the head chain's BASE. It sits on the head's
# rotation center, so it constrains none of the three head angles -- what it does is say
# where the pivot IS, which the six thorax-coxae cannot. They are very nearly coplanar
# (singular values 0.693 / 0.325 / 0.085) and the pivot sits 0.404 above their centroid,
# so registering off them alone extrapolates 4.7x along their worst-determined axis and
# puts the head a median 0.125 model units too dorsal -- 29% of the head's own radius,
# the same sign in all 55 corpus recordings -- which the antennae absorb as ~11 deg of
# spurious pitch. Because it is a base and not evidence, declaring BOTH antennae absent
# still leaves the head unfitted. A marker table that redeclares the head chain replaces
# the baked nomination too, so carry it over with `base = true`:
#
#   [inverse_kinematics.head]
#   neck      = { body = "c_head",    offset = [0.0, 0.0, 0.0], base = true }
#   l_antenna = { body = "l_pedicel", offset = [0.0, 0.0, 0.0] }
#   r_antenna = { body = "r_pedicel", offset = [0.0, 0.0, 0.0] }


# == Postprocess =============================================================
# Corrections from knowing the ANIMAL rather than the pixels, applied in order to the
# finished 3D. Keeping these priors out of the estimating stages is deliberate: an
# estimator already told the answer cannot be checked against it. Runs after the smoother
# because the smoother re-derives 3D from the 2D, so anything corrected before it is
# followed straight back off.
#
# ORDER MATTERS. With one fitted plane (the default) symmetrize is a FIXED map, so it
# leaves an already-static point static and static-then-symmetrize satisfies both exactly;
# the other order would not. Each op logs how far it moved what it touched -- a point
# drifting tens of pixels was moving, and belongs out of the list rather than nailed down.

# A tethered fly's thorax plate does not move, so these seven are a constant of the
# recording and everything the estimate does over time is per-frame noise. `abdomen*` is
# deliberately absent: it pitches, telescopes and bends, which is worth measuring.
[[postprocess.ops]]
op = "static"
method = "median"           # or mean / trimmed_mean / mode / geometric_median
points = ["neck",
          "lf_thorax_coxa", "lm_thorax_coxa", "lh_thorax_coxa",
          "rf_thorax_coxa", "rm_thorax_coxa", "rh_thorax_coxa"]

# Each side is triangulated from its own cameras, so a left/right pair drifts apart by
# whatever the two sides' errors differ by; this closes that gap. ONLY body-fixed pairs --
# never the legs, whose left/right asymmetry at any instant IS the behavior. The plane is
# fitted from `pairs` alone, so a point about to be moved onto it never votes on where it
# is, and a bent abdomen cannot drag it.
[[postprocess.ops]]
op = "symmetrize"
pairs = [["lf_thorax_coxa", "rf_thorax_coxa"],
         ["lm_thorax_coxa", "rm_thorax_coxa"],
         ["lh_thorax_coxa", "rh_thorax_coxa"]]
midline = ["neck"]


# == Visualization ===========================================================
# Each [[visualization.videos]] is one MP4. `grid` lays views out in cells, expanding to an
# `imshow` plus the named `plot` per cell with the offsets computed -- a cell whose view is
# not a camera (the synthetic `bird`) gets no imshow, and `""` leaves a gap. Add an
# explicit `panels` list for a layout a grid cannot say; it draws on top.
#
# `stage` names WHICH stage's points to draw. Left out it means "the most-derived stage
# present" -- so with eks on, a video named pose3d silently becomes the smoother's
# output and pose2d stops showing the detector at all. Naming it is how each video keeps
# meaning one thing, and the only way to render a before/after pair.
#
# `view = "bird"` is a synthetic dorsal plan view fitted to the animal's own body axes from
# the 3D: the one viewpoint showing all six legs with no body in the way, which the rig
# cannot have because the tether is up there. Having no footage, it never appears in the
# 2D video.
#
# `crop = "pose2d"` frames every panel through the window its own view's pathway detected
# through, resolved per view, so an axial camera is not a smudge in its cell -- and the box
# stays in exactly one place. A copy down here would keep showing the previous recording's
# window under an overlay that still looks well-formed.
[visualization]
background = "black"
crop = "pose2d"

# Joints draw as a solid outline ring whose fill opacity is the detector confidence, so a
# low-confidence joint fades to its ring instead of vanishing (`outline_thickness = 0`
# restores fill-only markers). `width`/`height` here also size the grid's cells.
[visualization.kwargs]
imshow       = { width = 480, height = 240 }
skeleton_2d  = { width = 480, height = 240, line_thickness = 2 }
skeleton_3d  = { width = 480, height = 240, line_thickness = 2 }
skeleton_nmf = { width = 480, height = 240, line_thickness = 2 }
mesh_nmf     = { width = 480, height = 240, alpha = 0.55 }

# Right-side cameras in the LEFT column, so the montage reads as the animal from above.
[[visualization.videos]]
video_name = "pose2d"       # camera frames with the raw 2D detections
plot  = "skeleton_2d"
stage = "pose2d"
grid  = [["rf", "f", "lf"], ["rm", "", "lm"], ["rh", "h", "lh"]]

[[visualization.videos]]
video_name = "pose3d"       # the triangulated 3D reprojected back into each view
plot  = "skeleton_3d"
stage = "triangulation"
grid  = [["rf", "f", "lf"], ["rm", "bird", "lm"], ["rh", "h", "lh"]]

[[visualization.videos]]
video_name = "pose_nmf"     # the fitted NeuroMechFly skeleton (needs [pipeline] inverse_kinematics)
plot  = "skeleton_nmf"
grid  = [["rf", "f", "lf"], ["rm", "", "lm"], ["rh", "h", "lh"]]

[[visualization.videos]]
video_name = "pose_mesh"    # the fitted NeuroMechFly mesh (needs [pipeline] inverse_kinematics)
plot  = "mesh_nmf"
grid  = [["rf", "f", "lf"], ["rm", "", "lm"], ["rh", "h", "lh"]]
