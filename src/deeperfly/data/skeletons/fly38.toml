# fly38 -- the 38 tracked points of a tethered Drosophila: six 5-point legs, two
# antennae, the neck, and a 5-point dorsal-midline abdomen chain (the tergite stripes).
#
# A skeleton is FOUR things: points, edges, symmetries, colors. Nothing else -- no
# groups, no chains, no subset names. Same shape as SLEAP and DeepLabCut.
#
# Referenced, not copied: a run config says nothing at all about the skeleton and takes
# the packaged one, or names another with `[skeleton] include`. NEVER edit a published
# skeleton in place -- a model trained under `fly38` resolves to whatever this file says
# today, and the points-equality check against the checkpoint is all that stands between
# a silent edit and silently mislabeled joints. Add a new name instead.
#
# This file was called `fly38b` up to the 0.2 release, when it became the only packaged
# skeleton and took the plain name. `include = "fly38b"` still resolves here.
#
# The six leg-tip points were `*_claw` until 0.3. `pretarsus` is the segment that is
# actually there -- the tarsus is five tarsomeres and the pretarsus is what sits distal
# to the fifth, carrying the claws, the pulvilli and the empodium -- and at this
# recording resolution a claw is not a thing anyone localizes. NOTHING ELSE MOVED: same
# points in the same order, same edges, same pairs, so the six names are the whole edit
# and the digest below moved only because names are part of it. Files written under the
# old names are migrated by declaring the rename, which is the only way anything can
# know the two names mean one point:
#
#     deeperfly project skeleton skeleton.toml --rename '*_claw=*_pretarsus' --apply
#
# A checkpoint records its own channel names and is compared against them on every run
# (deeperfly.pose2d.stream), so weights exported before 0.3 are refused until they are
# re-stamped: `scripts/rename_checkpoint_points.py`.
#
# It is NOT the historical DeepFly3D set, which also had 38 points and is what `fly38`
# named before 1.0: that one carried two three-marker abdomen SIDE chains
# (l_abdomen0..2 / r_abdomen0..2) and no neck. Same count, different points, different
# order -- so a labels.h5 or results.h5 written against it has to be remapped by name and
# never reinterpreted. `deeperfly project skeleton` is that migration; a run refuses
# outright (deeperfly.pipeline.run) rather than reading one skeleton's names against the
# other's columns.


[skeleton]
name = "fly38"

# The points IN ORDER: channel i of the detector is points[i]. This is the contract
# with the weights, checked every time they load.
points = [
    "lf_thorax_coxa", "lf_coxa_trochanter", "lf_femur_tibia", "lf_tibia_tarsus", "lf_pretarsus",
    "lm_thorax_coxa", "lm_coxa_trochanter", "lm_femur_tibia", "lm_tibia_tarsus", "lm_pretarsus",
    "lh_thorax_coxa", "lh_coxa_trochanter", "lh_femur_tibia", "lh_tibia_tarsus", "lh_pretarsus",
    "l_antenna",
    "rf_thorax_coxa", "rf_coxa_trochanter", "rf_femur_tibia", "rf_tibia_tarsus", "rf_pretarsus",
    "rm_thorax_coxa", "rm_coxa_trochanter", "rm_femur_tibia", "rm_tibia_tarsus", "rm_pretarsus",
    "rh_thorax_coxa", "rh_coxa_trochanter", "rh_femur_tibia", "rh_tibia_tarsus", "rh_pretarsus",
    "r_antenna",
    "neck",
    "abdomen0", "abdomen1", "abdomen2", "abdomen3", "abdomen4",
]

# The bones, as pairs of points; written source-first, which is the color an uncolored
# edge inherits. Used for the length prior, pictorial structures' graph, seeding a
# missing point in the editor, and the overlays. The antennae and neck appear in no
# edge -- tracked points with no bone.
edges = [
    ["lf_thorax_coxa", "lf_coxa_trochanter"], ["lf_coxa_trochanter", "lf_femur_tibia"],
    ["lf_femur_tibia", "lf_tibia_tarsus"], ["lf_tibia_tarsus", "lf_pretarsus"],
    ["lm_thorax_coxa", "lm_coxa_trochanter"], ["lm_coxa_trochanter", "lm_femur_tibia"],
    ["lm_femur_tibia", "lm_tibia_tarsus"], ["lm_tibia_tarsus", "lm_pretarsus"],
    ["lh_thorax_coxa", "lh_coxa_trochanter"], ["lh_coxa_trochanter", "lh_femur_tibia"],
    ["lh_femur_tibia", "lh_tibia_tarsus"], ["lh_tibia_tarsus", "lh_pretarsus"],
    ["rf_thorax_coxa", "rf_coxa_trochanter"], ["rf_coxa_trochanter", "rf_femur_tibia"],
    ["rf_femur_tibia", "rf_tibia_tarsus"], ["rf_tibia_tarsus", "rf_pretarsus"],
    ["rm_thorax_coxa", "rm_coxa_trochanter"], ["rm_coxa_trochanter", "rm_femur_tibia"],
    ["rm_femur_tibia", "rm_tibia_tarsus"], ["rm_tibia_tarsus", "rm_pretarsus"],
    ["rh_thorax_coxa", "rh_coxa_trochanter"], ["rh_coxa_trochanter", "rh_femur_tibia"],
    ["rh_femur_tibia", "rh_tibia_tarsus"], ["rh_tibia_tarsus", "rh_pretarsus"],
    ["abdomen0", "abdomen1"], ["abdomen1", "abdomen2"], ["abdomen2", "abdomen3"], ["abdomen3", "abdomen4"],
]

# What each point becomes under a left/right flip. Write each pair once; anything absent
# is on the midline and maps to itself (hence no neck, no abdomen).
#
# 16 rows is 16 chances to swap a side silently, so the loader checks the permutation
# against `edges`: applying it must give `edges` back. A wrong side, or two joints of
# one leg exchanged, breaks that and is named.
symmetries = [
    ["lf_thorax_coxa",     "rf_thorax_coxa"],
    ["lf_coxa_trochanter", "rf_coxa_trochanter"],
    ["lf_femur_tibia",     "rf_femur_tibia"],
    ["lf_tibia_tarsus",    "rf_tibia_tarsus"],
    ["lf_pretarsus",            "rf_pretarsus"],
    ["lm_thorax_coxa",     "rm_thorax_coxa"],
    ["lm_coxa_trochanter", "rm_coxa_trochanter"],
    ["lm_femur_tibia",     "rm_femur_tibia"],
    ["lm_tibia_tarsus",    "rm_tibia_tarsus"],
    ["lm_pretarsus",            "rm_pretarsus"],
    ["lh_thorax_coxa",     "rh_thorax_coxa"],
    ["lh_coxa_trochanter", "rh_coxa_trochanter"],
    ["lh_femur_tibia",     "rh_femur_tibia"],
    ["lh_tibia_tarsus",    "rh_tibia_tarsus"],
    ["lh_pretarsus",            "rh_pretarsus"],
    ["l_antenna",          "r_antenna"],
]

# One color per point; a key is a point name or a `*` pattern. Two patterns matching one
# point is an error, not a precedence rule; an exact name beats a pattern. Edges take
# the color of the point they are written FROM, so this colors both.
#
# Optional -- without it points take a colormap by index. This palette is left = blue,
# right = red, lightening front -> hind, midline on its own green ramp from neck to
# abdomen, so a point's side reads at a glance.
[skeleton.colors]
"lf_*" = "#0f7399"
"lm_*" = "#1a8daf"
"lh_*" = "#75becb"
l_antenna = "#0a4f6b"
"rf_*" = "#ba1e31"
"rm_*" = "#c9564f"
"rh_*" = "#d58579"
r_antenna = "#8c1525"
neck = "#15a315"
"abdomen*" = "#61e47b"
