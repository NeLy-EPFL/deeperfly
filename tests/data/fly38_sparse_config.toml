# The 19-channel SPARSE plan -- the config deeperfly shipped before the dense detector.
#
# Kept as a test fixture, not as a recommendation: it is the only plan in the repo where
# a view is PARTIALLY observed, so it is what the tests about per-view visibility, the
# mirrored-pathway left/right check and [pose2d.output_points] are written against. The
# packaged config and every example are dense (`class = "mvt"`, no mapping table), and a
# new recording should start from one of those.
#
# The detector predicts ONE BODY SIDE, so each side camera runs once and the front camera
# runs twice (once through a `fliplr`), and the 132 rows below say where each pass's 19
# channels land. Half of every side view is NaN by construction: there is no channel that
# could have filled it.


# == Footage =================================================================
[[sources]]
name = "vid_rh"
filename = ["camera_RH.mp4", "camera_0.mp4"]
[[sources]]
name = "vid_rm"
filename = ["camera_RM.mp4", "camera_1.mp4"]
[[sources]]
name = "vid_rf"
filename = ["camera_RF.mp4", "camera_2.mp4"]
[[sources]]
name = "vid_f"
filename = ["camera_F.mp4", "camera_3.mp4"]
[[sources]]
name = "vid_lf"
filename = ["camera_LF.mp4", "camera_4.mp4"]
[[sources]]
name = "vid_lm"
filename = ["camera_LM.mp4", "camera_5.mp4"]
[[sources]]
name = "vid_lh"
filename = ["camera_LH.mp4", "camera_6.mp4"]


# == Skeleton ================================================================
# `fly38`: two mirrored 19-point halves, so the partner of point i is point i + 19. That
# block layout is what makes a side-agnostic 19-channel detector expressible at all.
# By PATH, not by name: this plan's 19 channels are one body half of the historical
# DeepFly3D point set, which is no longer a packaged skeleton (`fly38` now names the
# midline-abdomen one). The file sits beside this config.
[skeleton]
file = "fly38_deepfly3d.toml"


# == Views ===================================================================
[cameras.defaults]
focal_length_px = 22388.125
distance = 107.463

[cameras.rh]
azimuth_deg = -120
[cameras.rm]
azimuth_deg = -90
[cameras.rf]
azimuth_deg = -45
[cameras.f]
azimuth_deg = 0
[cameras.lf]
azimuth_deg = 45
[cameras.lm]
azimuth_deg = 90
[cameras.lh]
azimuth_deg = 120


# == Pipeline ================================================================
[pipeline]
do_pose2d               = true
do_bundle_adjustment    = true
do_pictorial_structures = false
do_triangulation        = true
do_eks                  = false
do_postprocess          = false
do_inverse_kinematics   = false
do_visualization        = true


# == 2D detection ============================================================
# The plan this file exists for. `weights = ""` is the one class that needs no
# checkpoint: the published DeepFly2D weights are downloaded and cached on first use.
[pose2d]
precision = "float16"
model = "deepfly2d"
models = [
    { name = "deepfly2d", class = "hrnet", weights = "unused-in-tests.pth", input_size = [256, 512], n_out_channels = 19 },
]

# The left side reaches the detector's one-sided convention through a mirror; which side
# a channel then means is decided ONLY by the tables below, so a single typo there swaps
# a body side. `check_mirror_consistency` holds them against [skeleton].symmetries at load.
preprocessors = [
    { name = "flip", ops = [{ op = "fliplr" }] },
]

pathways = [
    { name = "rh", source = "vid_rh" },
    { name = "rm", source = "vid_rm" },
    { name = "rf", source = "vid_rf" },
    { name = "f", source = "vid_f" },
    { name = "f_flip", source = "vid_f", preprocessor = "flip" },
    { name = "lf_flip", source = "vid_lf", preprocessor = "flip" },
    { name = "lm_flip", source = "vid_lm", preprocessor = "flip" },
    { name = "lh_flip", source = "vid_lh", preprocessor = "flip" },
]

# Where each pass's channels land: `point = { pathway, out_channel }` fills that
# point of the view. A (view, point) no row names stays NaN, and that union IS the
# visibility mask. The front view is filled by two pathways -- the un-flipped pass
# supplies the right distal joints, the mirrored pass the left.
[pose2d.output_points.rh]
rf_thorax_coxa     = { pathway = "rh", out_channel = 0  }
rf_coxa_trochanter = { pathway = "rh", out_channel = 1  }
rf_femur_tibia     = { pathway = "rh", out_channel = 2  }
rf_tibia_tarsus    = { pathway = "rh", out_channel = 3  }
rf_claw            = { pathway = "rh", out_channel = 4  }
rm_thorax_coxa     = { pathway = "rh", out_channel = 5  }
rm_coxa_trochanter = { pathway = "rh", out_channel = 6  }
rm_femur_tibia     = { pathway = "rh", out_channel = 7  }
rm_tibia_tarsus    = { pathway = "rh", out_channel = 8  }
rm_claw            = { pathway = "rh", out_channel = 9  }
rh_thorax_coxa     = { pathway = "rh", out_channel = 10 }
rh_coxa_trochanter = { pathway = "rh", out_channel = 11 }
rh_femur_tibia     = { pathway = "rh", out_channel = 12 }
rh_tibia_tarsus    = { pathway = "rh", out_channel = 13 }
rh_claw            = { pathway = "rh", out_channel = 14 }
r_antenna          = { pathway = "rh", out_channel = 15 }
r_abdomen0         = { pathway = "rh", out_channel = 16 }
r_abdomen1         = { pathway = "rh", out_channel = 17 }
r_abdomen2         = { pathway = "rh", out_channel = 18 }

